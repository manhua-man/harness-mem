[package]
name = "harness_mem_core_rs"
version = "4.0.2"
edition = "2021"
description = "Deterministic hot-path helpers for harness-mem Storage v2"
license = "Apache-2.0"

[lib]
name = "harness_mem_core_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23.3", features = ["abi3-py39"] }
serde_json = "1.0"
