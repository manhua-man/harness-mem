[project]
name = "harness-mem"
version = "1.8.0"
description = "Local-first, pluggable AI memory runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "sqlite-utils>=3.35",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "twine>=5.1.1",
]
hybrid = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
]
benchmark = [
    "PyStemmer>=3.0.0",
]

[project.scripts]
harness-mem = "harness_mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_mem"]

[tool.hatch.build.targets.sdist]
include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "README.md",
    "docs/error-codes.md",
    "harness_mem",
]
