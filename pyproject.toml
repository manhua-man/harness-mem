[project]
name = "harness-mem"
version = "0.8.23.3"
description = "Local-first, auditable, pluggable Agent memory backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "sqlite-utils>=3.35",
    "tomli_w>=1.0,<1.3",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.0.0",
    "build>=1.2.2",
    "hatchling>=1.27.0",
    "maturin>=1.7,<2.0",
    "hypothesis>=6.0",
    "mypy>=1.11.0",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0",
    "ruff>=0.6.0",
    "tiktoken>=0.7.0",
]
hybrid = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
]
rerank = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
harness-mem = "harness_mem.cli:main"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/harness_mem_core_rs/Cargo.toml"
module-name = "harness_mem_core_rs"
python-packages = ["harness_mem"]
features = ["pyo3/extension-module"]
include = [
    { path = "harness_mem/integration/templates/*.template", format = "wheel" },
]

[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "mcp",
    "mcp.client.stdio",
    "sentence_transformers",
]
ignore_missing_imports = true
