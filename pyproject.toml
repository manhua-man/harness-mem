[project]
name = "harness-mem"
version = "1.2.0"
description = "Local-first, pluggable AI memory runtime"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "sqlite-utils>=3.35",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
hybrid = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
harness-mem = "harness_mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_mem"]

[tool.hatch.build.targets.sdist]
include = ["harness_mem"]
