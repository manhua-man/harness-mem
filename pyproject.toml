[project]
name = "harness-mem"
version = "2.9.42"
description = "Local-first, pluggable AI memory runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "sqlite-utils>=3.35",
    "tomli_w>=1.0,<1.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "hypothesis>=6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "twine>=5.1.1",
]
hybrid = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
]
benchmark = [
    "PyStemmer>=3.0.0",
]

[project.scripts]
harness-mem = "harness_mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Force-include the IDE hook templates so they ship inside the wheel/sdist.
# They live under the harness_mem package directory, so hatchling already packs
# them as package data; ``artifacts`` makes that explicit and survives any
# future VCS-exclusion rule that might otherwise filter non-.py files.
[tool.hatch.build]
artifacts = [
    "harness_mem/integration/templates/*.template",
]

[tool.hatch.build.targets.wheel]
packages = ["harness_mem"]

[tool.hatch.build.targets.sdist]
include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "README.md",
    "docs/error-codes.md",
    "harness_mem",
    "harness_mem/integration/templates/*.template",
]
