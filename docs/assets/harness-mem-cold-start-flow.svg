<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem cold-start flow</title>
  <desc id="desc">A fresh Agent wakes, searches when uncertain, distills session evidence, reviews candidates, and runs dream maintenance against a local auditable memory backend.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #0f172a; }
      .muted { fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .card-accent { fill: #effaf6; stroke: #8ad1b2; stroke-width: 2; }
      .store { fill: #0f172a; }
      .teal { fill: #0ea5a4; }
      .amber { fill: #f59e0b; }
      .line { fill: none; stroke: #0ea5a4; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .line-muted { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: 0; }
      .body { font-size: 20px; letter-spacing: 0; }
      .small { font-size: 16px; letter-spacing: 0; }
      .step { font-size: 28px; font-weight: 750; letter-spacing: 0; }
      .step-body { font-size: 16px; letter-spacing: 0; }
      .note { font-size: 15px; letter-spacing: 0; }
    </style>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6">
      <path d="M1 1l10 5-10 5z" fill="#0ea5a4"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="540" rx="30"/>

  <text x="70" y="72" class="title ink">Cold-start memory loop</text>
  <text x="70" y="106" class="body muted">A fresh Agent recovers decisions, routes uncertainty into search, and keeps evidence, review, and maintenance honest.</text>

  <rect x="70" y="154" width="155" height="150" rx="22" class="card"/>
  <circle cx="118" cy="206" r="22" class="teal"/>
  <path d="M108 206h20M118 196v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="98" y="258" class="step ink">Agent</text>
  <text x="95" y="286" class="step-body muted">fresh session</text>

  <path d="M245 229h48" class="line" marker-end="url(#arrow)"/>

  <rect x="303" y="154" width="145" height="150" rx="22" class="card"/>
  <text x="349" y="206" class="step ink">wake</text>
  <text x="330" y="236" class="step-body muted">confirmed</text>
  <text x="327" y="258" class="step-body muted">project brief</text>

  <path d="M448 229h48" class="line" marker-end="url(#arrow)"/>

  <rect x="506" y="154" width="145" height="150" rx="22" class="card"/>
  <text x="544" y="206" class="step ink">search</text>
  <text x="522" y="236" class="step-body muted">triggered by</text>
  <text x="522" y="258" class="step-body muted">uncertainty</text>
  <circle cx="548" cy="286" r="8" class="teal"/>
  <circle cx="575" cy="286" r="8" class="teal"/>
  <circle cx="602" cy="286" r="8" class="teal"/>

  <path d="M651 229h48" class="line" marker-end="url(#arrow)"/>

  <rect x="709" y="154" width="155" height="150" rx="22" class="card"/>
  <text x="749" y="206" class="step ink">distill</text>
  <text x="725" y="236" class="step-body muted">reads every</text>
  <text x="729" y="258" class="step-body muted">ordered chunk</text>

  <path d="M864 229h48" class="line" marker-end="url(#arrow)"/>

  <rect x="922" y="154" width="145" height="150" rx="22" class="card"/>
  <text x="960" y="206" class="step ink">review</text>
  <text x="942" y="236" class="step-body muted">audit inbox,</text>
  <text x="940" y="258" class="step-body muted">undo/supersede</text>

  <path d="M1067 229h48" class="line" marker-end="url(#arrow)"/>

  <rect x="1125" y="154" width="145" height="150" rx="22" class="card-accent"/>
  <text x="1162" y="206" class="step ink">dream</text>
  <text x="1145" y="236" class="step-body muted">after candidate</text>
  <text x="1141" y="258" class="step-body muted">review completes</text>

  <path d="M1198 304v38" class="line" marker-end="url(#arrow)"/>

  <rect x="228" y="364" width="824" height="104" rx="24" class="store"/>
  <text x="258" y="408" class="body" fill="#e5e7eb">lossless transcript ledger</text>
  <text x="548" y="408" class="body" fill="#99f6e4">canonical memory / review / Dream</text>
  <text x="258" y="430" class="note" fill="#94a3b8">Hooks save immutable revisions and queue every chunk; the next Agent</text>
  <text x="258" y="452" class="note" fill="#94a3b8">checkpoints all chunks, reviews the final outcome, then promotes.</text>

  <path d="M1198 364v-22" class="line-muted"/>
  <path d="M1198 342 C 1198 330 1104 330 1090 330" class="line-muted" marker-end="url(#arrow)"/>

  <text x="74" y="500" class="small muted">The user sees one loop: wake, task-aware search, distill, review, and dream. Nothing becomes hidden truth.</text>
</svg>
