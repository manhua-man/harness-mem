<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem one-command daily flow and unattended Dream flow</title>
  <desc id="desc">Quickstart runs once globally for the current Agent app. Codex then uses $hm and the other supported hosts use /hm in any project; the first use prepares that project's Hooks. Users ask to remember this session, find earlier work, or correct a memory. A Hook saves an immutable revision, creates or advances its session job, and wakes Dream.</desc>
  <defs>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.teal{fill:#0f766e}.gold{fill:#c99532}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.soft{fill:#ecfdf5;stroke:#5fbf9a;stroke-width:2}
      .warm{fill:#fff7ed;stroke:#d99a45;stroke-width:2}.dark{fill:#0f172a}.lane{fill:#fff;stroke:#94a3b8;stroke-width:2}
      .title{font-size:38px;font-weight:760}.subtitle{font-size:20px}.eyebrow{font-size:16px;font-weight:750;letter-spacing:1px}
      .heading{font-size:25px;font-weight:750}.body{font-size:18px}.small{font-size:16px}.code{font:650 17px "Cascadia Mono",Consolas,monospace}
      .line{fill:none;stroke:#0f766e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .hook{fill:none;stroke:#c99532;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#goldArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0f766e"/></marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#c99532"/></marker>
  </defs>
  <rect class="bg" width="1440" height="760"/>
  <rect class="teal" width="1440" height="10"/>
  <text x="64" y="66" class="title ink">One daily entry — three plain requests</text>
  <text x="64" y="100" class="subtitle muted">Quickstart once globally · Codex: $hm · other hosts: /hm · first use prepares project Hooks</text>
  <g transform="translate(1204 38)"><rect class="soft" width="172" height="42" rx="21"/><text x="20" y="28" class="eyebrow teal">source 0.9.26</text></g>
  <text x="64" y="148" class="eyebrow muted">WHAT USERS SAY</text>
  <g transform="translate(64 174)">
    <rect class="card" width="390" height="172" rx="18"/>
    <circle cx="44" cy="42" r="22" class="teal"/><path d="M34 42h20M44 32v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="50" class="heading ink">Remember this session</text>
    <text x="28" y="92" class="code teal">“remember this”</text>
    <text x="28" y="125" class="body muted">Process the current session;</text>
    <text x="28" y="151" class="body muted">say what was and was not saved.</text>
  </g>
  <g transform="translate(525 174)">
    <rect class="soft" width="390" height="172" rx="18"/>
    <circle cx="44" cy="42" r="22" class="teal"/><path d="M34 42h20M44 32v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="50" class="heading ink">Find earlier work</text>
    <text x="28" y="92" class="code teal">“find how we did this”</text>
    <text x="28" y="125" class="body muted">Search this project by default;</text>
    <text x="28" y="151" class="body muted">cross projects only when asked.</text>
  </g>
  <g transform="translate(986 174)">
    <rect class="warm" width="390" height="172" rx="18"/>
    <circle cx="44" cy="42" r="22" class="gold"/><path d="M33 42h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="50" class="heading ink">Correct a memory</text>
    <text x="28" y="92" class="code" fill="#a16207">“this memory is wrong”</text>
    <text x="28" y="125" class="body muted">Find the affected knowledge;</text>
    <text x="28" y="151" class="body muted">change only that item.</text>
  </g>
  <text x="64" y="398" class="eyebrow muted">HOOK → DREAM — UNATTENDED LANE</text>
  <g transform="translate(64 424)">
    <rect class="lane" width="270" height="128" rx="16"/>
    <text x="24" y="40" class="heading ink">Stop Hook</text>
    <text x="24" y="75" class="body muted">Save immutable revision</text>
    <text x="24" y="102" class="body muted">Create / advance session job</text>
  </g>
  <path class="hook" d="M334 488h62"/>
  <g transform="translate(410 424)">
    <rect class="lane" width="270" height="128" rx="16"/>
    <text x="24" y="40" class="heading ink">Dream signal</text>
    <text x="24" y="75" class="body muted">Project has new activity</text>
    <text x="24" y="102" class="body muted">Source reference stays bound</text>
  </g>
  <path class="line" d="M680 488h62"/>
  <g transform="translate(756 424)">
    <rect class="soft" width="270" height="128" rx="16"/>
    <text x="24" y="40" class="heading ink">Dream worker</text>
    <text x="24" y="75" class="body muted">Use selected CLI</text>
    <text x="24" y="102" class="body muted">Default: current host</text>
  </g>
  <path class="line" d="M1026 488h62"/>
  <g transform="translate(1102 424)">
    <rect class="soft" width="274" height="128" rx="16"/>
    <text x="24" y="40" class="heading ink">Verified result</text>
    <text x="24" y="75" class="body muted">Assimilate or close safely</text>
    <text x="24" y="102" class="body muted">Saved memory becomes searchable</text>
  </g>
  <g transform="translate(64 602)">
    <rect class="dark" width="1312" height="104" rx="20"/>
    <text x="32" y="42" class="heading" fill="#fff">Three storage roles</text>
    <text x="330" y="42" class="body" fill="#ccfbf1">Transcript ledger = raw evidence</text>
    <text x="680" y="42" class="body" fill="#fde68a">Job workspace = temporary</text>
    <text x="1030" y="42" class="body" fill="#99f6e4">SQLite = current knowledge</text>
    <text x="32" y="76" class="small" fill="#cbd5e1">Hooks save immutable revisions; Dream runs in the background. A queued or completed flag alone does not prove the result.</text>
  </g>
</svg>
