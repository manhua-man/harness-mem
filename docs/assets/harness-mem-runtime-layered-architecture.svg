<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem 0.9.25 functional architecture</title>
  <desc id="desc">Seven host-native clients and 27 public MCP tools enter a five-module runtime: session intake and lifecycle, extraction, per-point verification, assimilation, and retrieval and use. Review and Dream feed governed evidence back into verification and assimilation. Transcript evidence, temporary job material, SQLite current knowledge, and rebuildable indexes remain separate storage roles.</desc>
  <defs>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.teal{fill:#0f766e}.gold{fill:#c99532}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.source{fill:#eff6ff;stroke:#73aedd;stroke-width:2}
      .soft{fill:#ecfdf5;stroke:#5fbf9a;stroke-width:2}.warm{fill:#fff7ed;stroke:#d99a45;stroke-width:2}
      .violet{fill:#f5f3ff;stroke:#9f8bd7;stroke-width:2}.dark{fill:#0f172a}
      .title{font-size:38px;font-weight:760}.subtitle{font-size:20px}.eyebrow{font-size:16px;font-weight:750;letter-spacing:1px}
      .heading{font-size:22px;font-weight:750}.body{font-size:18px}.small{font-size:16px}.code{font:650 17px "Cascadia Mono",Consolas,monospace}
      .line{fill:none;stroke:#0f766e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#c99532;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#goldArrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#grayArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0f766e"/></marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#c99532"/></marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="teal" width="1440" height="10"/>
  <text x="64" y="66" class="title ink">Five-module memory runtime</text>
  <text x="64" y="100" class="subtitle muted">Daily actions map onto the architecture; they do not replace it.</text>
  <g transform="translate(1228 38)"><rect class="soft" width="148" height="42" rx="21"/><text x="28" y="28" class="eyebrow teal">v0.9.25</text></g>

  <text x="64" y="142" class="eyebrow muted">SURFACES</text>
  <g transform="translate(64 160)">
    <rect class="card" width="1312" height="104" rx="18"/>
    <g transform="translate(24 18)">
      <text x="0" y="24" class="heading ink">Seven native hosts</text>
      <text x="0" y="54" class="body muted">Codex · Claude · Cursor · Grok</text>
      <text x="0" y="78" class="small muted">Hermes · OpenCode · Antigravity · shared daily actions</text>
    </g>
    <line x1="520" y1="18" x2="520" y2="86" stroke="#cbd5e1" stroke-width="2"/>
    <g transform="translate(550 18)">
      <text x="0" y="24" class="heading ink">MCP: 27 public tools</text>
      <text x="0" y="54" class="body muted">Public tools register directly</text>
      <text x="0" y="78" class="small muted">Compact + drilldown · unknown stays unknown</text>
    </g>
    <line x1="1030" y1="18" x2="1030" y2="86" stroke="#cbd5e1" stroke-width="2"/>
    <g transform="translate(1060 18)">
      <text x="0" y="24" class="heading ink">CLI</text>
      <text x="0" y="54" class="body muted">setup · doctor · config</text>
      <text x="0" y="78" class="small muted">integration · maintenance</text>
    </g>
  </g>

  <text x="64" y="306" class="eyebrow muted">FUNCTIONAL MODULES</text>
  <g transform="translate(64 326)">
    <rect class="source" width="240" height="176" rx="18"/>
    <text x="22" y="36" class="eyebrow teal">0 · INTAKE</text>
    <text x="22" y="72" class="heading ink">Session lifecycle</text>
    <text x="22" y="106" class="body muted">Revision · chunks · job</text>
    <text x="22" y="134" class="body muted">Receipt · retry · cleanup</text>
    <text x="22" y="160" class="small muted">Hook captures; does not judge</text>
  </g>
  <path class="line" d="M304 414h18"/>
  <g transform="translate(336 326)">
    <rect class="card" width="240" height="176" rx="18"/>
    <text x="22" y="36" class="eyebrow teal">1 · EXTRACT</text>
    <text x="22" y="72" class="heading ink">Promotion points</text>
    <text x="22" y="106" class="body muted">0–12 narrow claims</text>
    <text x="22" y="134" class="body muted">Location + full manifest</text>
    <text x="22" y="160" class="small muted">No disposition or truth write</text>
  </g>
  <path class="line" d="M576 414h18"/>
  <g transform="translate(608 326)">
    <rect class="source" width="240" height="176" rx="18"/>
    <text x="22" y="36" class="eyebrow teal">2 · VERIFY</text>
    <text x="22" y="72" class="heading ink">Answer Gate</text>
    <text x="22" y="106" class="body muted">Integrity + support</text>
    <text x="22" y="134" class="body muted">One point at a time</text>
    <text x="22" y="160" class="small muted">Missing or stale fails closed</text>
  </g>
  <path class="line" d="M848 414h18"/>
  <g transform="translate(880 326)">
    <rect class="soft" width="240" height="176" rx="18"/>
    <text x="22" y="36" class="eyebrow teal">3 · ASSIMILATE</text>
    <text x="22" y="72" class="heading ink">Reconcile truth</text>
    <text x="22" y="106" class="body muted">Split · dedupe · replace</text>
    <text x="22" y="134" class="body muted">Write or explicit no-write</text>
    <text x="22" y="160" class="small muted">Clean proven terminal work</text>
  </g>
  <path class="line" d="M1120 414h18"/>
  <g transform="translate(1152 326)">
    <rect class="card" width="224" height="176" rx="18"/>
    <text x="22" y="36" class="eyebrow teal">4 · RETRIEVE</text>
    <text x="22" y="72" class="heading ink">Use current truth</text>
    <text x="22" y="106" class="body muted">Clean wake / search</text>
    <text x="22" y="134" class="body muted">Used · ignored · stale</text>
    <text x="22" y="160" class="small muted">No raw or audit leakage</text>
  </g>

  <path class="feedback" d="M1264 502v28H1000v-18"/>
  <text x="1046" y="526" class="small" fill="#a16207">Review / Dream feedback</text>

  <text x="64" y="560" class="eyebrow muted">EXECUTION BOUNDARIES</text>
  <g transform="translate(64 580)">
    <rect class="dark" width="1312" height="112" rx="18"/>
    <text x="26" y="36" class="heading" fill="#fff">Manual distill</text>
    <text x="26" y="68" class="body" fill="#cbd5e1">active host → modules 1–3</text>
    <text x="26" y="94" class="small" fill="#94a3b8">never redirected to background execution</text>
    <line x1="360" y1="18" x2="360" y2="94" stroke="#334155" stroke-width="2"/>
    <text x="390" y="36" class="heading" fill="#fff">Hook</text>
    <text x="390" y="68" class="body" fill="#fde68a">module 0 only → session job + Dream signal</text>
    <text x="390" y="94" class="small" fill="#94a3b8">queued is not a completed user result</text>
    <line x1="820" y1="18" x2="820" y2="94" stroke="#334155" stroke-width="2"/>
    <text x="850" y="36" class="heading" fill="#fff">Authorized Dream</text>
    <text x="850" y="68" class="body" fill="#99f6e4">session queue + project governance queue</text>
    <text x="850" y="94" class="small" fill="#94a3b8">enabled + host CLI · strict schema · trusted runtime writes</text>
  </g>

  <text x="64" y="738" class="eyebrow muted">STORAGE ROLES</text>
  <g transform="translate(64 758)">
    <rect class="source" width="300" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Transcript ledger</text>
    <text x="22" y="70" class="body muted">raw revisions / chunks</text>
    <text x="22" y="94" class="small muted">evidence authority</text>
  </g>
  <g transform="translate(390 758)">
    <rect class="violet" width="300" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Job workspace</text>
    <text x="22" y="70" class="body muted">candidate / evidence / decision</text>
    <text x="22" y="94" class="small muted">temporary processing material</text>
  </g>
  <g transform="translate(716 758)">
    <rect class="soft" width="300" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Canonical SQLite</text>
    <text x="22" y="70" class="code teal">knowledge_entries</text>
    <text x="22" y="94" class="small muted">single current-knowledge authority</text>
  </g>
  <g transform="translate(1042 758)">
    <rect class="card" width="334" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Rebuildable projections</text>
    <text x="22" y="70" class="body muted">FTS / vector / Markdown</text>
    <text x="22" y="94" class="small muted">never a truth authority</text>
  </g>
</svg>
