<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem lossless session distillation</title>
  <desc id="desc">A native transcript becomes an immutable revision, lossless chunks, a complete manifest, and semantic and raw drilldown. Explicit distill stays in the active host; a Hook only queues the session and wakes Dream. Both paths extract zero to twelve points, verify each point, and assimilate only proven reusable knowledge into SQLite knowledge_entries.</desc>
  <defs>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.teal{fill:#0f766e}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.source{fill:#eff6ff;stroke:#73aedd;stroke-width:2}
      .soft{fill:#ecfdf5;stroke:#5fbf9a;stroke-width:2}.warm{fill:#fff7ed;stroke:#d99a45;stroke-width:2}
      .violet{fill:#f5f3ff;stroke:#9f8bd7;stroke-width:2}.dark{fill:#0f172a}
      .title{font-size:38px;font-weight:760}.subtitle{font-size:20px}.eyebrow{font-size:16px;font-weight:750;letter-spacing:1px}
      .heading{font-size:23px;font-weight:750}.body{font-size:18px}.small{font-size:16px}.code{font:650 17px "Cascadia Mono",Consolas,monospace}
      .line{fill:none;stroke:#0f766e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#grayArrow)}
      .hook{fill:none;stroke:#c99532;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#goldArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0f766e"/></marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#64748b"/></marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#c99532"/></marker>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <rect class="teal" width="1440" height="10"/>
  <text x="64" y="66" class="title ink">Lossless session distillation</text>
  <text x="64" y="100" class="subtitle muted">Evidence stays reconstructable; extraction, verification, and assimilation remain separate decisions.</text>
  <g transform="translate(1228 38)"><rect class="soft" width="148" height="42" rx="21"/><text x="28" y="28" class="eyebrow teal">v0.9.25</text></g>

  <text x="64" y="148" class="eyebrow muted">0 · SESSION INTAKE AND LIFECYCLE</text>
  <g transform="translate(64 174)">
    <rect class="source" width="264" height="150" rx="16"/>
    <text x="24" y="42" class="heading ink">Native transcript</text>
    <text x="24" y="78" class="body muted">Seven host adapters</text>
    <text x="24" y="106" class="body muted">Project + session identity</text>
    <text x="24" y="134" class="body muted">Private spans excluded first</text>
  </g>
  <path class="line" d="M328 249h42"/>
  <g transform="translate(384 174)">
    <rect class="soft" width="264" height="150" rx="16"/>
    <text x="24" y="42" class="heading ink">Immutable revision</text>
    <text x="24" y="78" class="code teal">raw bytes + digest</text>
    <text x="24" y="106" class="body muted">Content-addressed source</text>
    <text x="24" y="134" class="body muted">Safe retry and replay</text>
  </g>
  <path class="line" d="M648 249h42"/>
  <g transform="translate(704 174)">
    <rect class="soft" width="264" height="150" rx="16"/>
    <text x="24" y="42" class="heading ink">Lossless chunks</text>
    <text x="24" y="78" class="body muted">Turn and tool-result safe</text>
    <text x="24" y="106" class="body muted">Complete ordered manifest</text>
    <text x="24" y="134" class="body muted">Continuation metadata</text>
  </g>
  <path class="line" d="M968 249h42"/>
  <g transform="translate(1024 174)">
    <rect class="violet" width="352" height="150" rx="16"/>
    <text x="24" y="42" class="heading ink">Semantic + raw drilldown</text>
    <text x="24" y="78" class="body muted">High-recall windows for extraction</text>
    <text x="24" y="106" class="body muted">Exact chunks remain reopenable</text>
    <text x="24" y="134" class="body muted">Manifest proves full coverage</text>
  </g>

  <text x="64" y="378" class="eyebrow muted">TWO EXECUTION ENTRIES — ONE POINT-LEVEL CONTRACT</text>
  <g transform="translate(64 404)">
    <rect class="card" width="286" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Explicit distill</text>
    <text x="22" y="72" class="body muted">Active host reads the session</text>
    <text x="22" y="96" class="small muted">Never redirected to background</text>
  </g>
  <g transform="translate(64 528)">
    <rect class="warm" width="286" height="104" rx="16"/>
    <text x="22" y="38" class="heading ink">Hook-started Dream</text>
    <text x="22" y="72" class="body muted">Hook stores job + activity signal</text>
    <text x="22" y="96" class="small muted">Dream performs semantic work</text>
  </g>
  <path class="branch" d="M350 456h46v50h42"/>
  <path class="hook" d="M350 580h46v-50h42"/>

  <g transform="translate(452 456)">
    <rect class="card" width="246" height="152" rx="16"/>
    <text x="22" y="38" class="eyebrow teal">1 · EXTRACT</text>
    <text x="22" y="75" class="heading ink">0–12 points</text>
    <text x="22" y="108" class="body muted">Narrow claims</text>
    <text x="22" y="134" class="body muted">Reopenable locations</text>
  </g>
  <path class="line" d="M698 532h40"/>
  <g transform="translate(752 456)">
    <rect class="source" width="246" height="152" rx="16"/>
    <text x="22" y="38" class="eyebrow teal">2 · VERIFY</text>
    <text x="22" y="75" class="heading ink">Each point</text>
    <text x="22" y="108" class="body muted">Integrity + support</text>
    <text x="22" y="134" class="body muted">Fail closed when unsafe</text>
  </g>
  <path class="line" d="M998 532h40"/>
  <g transform="translate(1052 456)">
    <rect class="soft" width="324" height="152" rx="16"/>
    <text x="22" y="38" class="eyebrow teal">3 · ASSIMILATE</text>
    <text x="22" y="75" class="heading ink">Reconcile current truth</text>
    <text x="22" y="108" class="body muted">Write one reusable fact, or</text>
    <text x="22" y="134" class="body muted">close with an explicit non-write</text>
  </g>

  <g transform="translate(64 684)">
    <rect class="dark" width="1312" height="96" rx="18"/>
    <text x="28" y="36" class="heading" fill="#fff">Authority and retention</text>
    <text x="340" y="36" class="body" fill="#ccfbf1">Transcript ledger preserves source evidence</text>
    <text x="780" y="36" class="body" fill="#fde68a">Candidate / evidence / decision are job-scoped</text>
    <text x="28" y="66" class="small" fill="#cbd5e1">Requirement: every expected chunk is checkpointed with zero character loss.</text>
    <text x="28" y="86" class="small" fill="#cbd5e1">Temporary material is cleaned only after a proven terminal outcome; SQLite knowledge_entries remains current truth.</text>
  </g>
</svg>
