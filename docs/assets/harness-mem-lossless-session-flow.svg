<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem lossless session distillation</title>
  <desc id="desc">Immutable raw revisions feed a hash-verified append projection, turn- and tool-safe semantic windows, and candidate evidence. Explicit distill stays in its active host; a Hook wakes Dream to process its session and project governance. Both cross verification and governed assimilation before a durable result. Manual review is a post-hoc audit and undo path.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .source { fill: #eff6ff; stroke: #7db7dc; stroke-width: 2; }
      .ledger { fill: #ecfdf5; stroke: #66bf9b; stroke-width: 2; }
      .review { fill: #fff7ed; stroke: #e9a85e; stroke-width: 2; }
      .truth { fill: #f0fdf4; stroke: #5fbd82; stroke-width: 2; }
      .receipt { fill: #f5f3ff; stroke: #9b87d3; stroke-width: 2; }
      .label { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .code { font: 600 12px "Cascadia Mono", Consolas, monospace; fill: #0f6fbf; }
      .note { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #0f8c87; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#grayArrow); }
      .fallback { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#amberArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f8c87"/>
    </marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="720"/>
  <text class="title" x="52" y="62">Lossless session distillation</text>
  <text class="subtitle" x="52" y="94">Raw evidence remains authoritative; incremental projections are verified, rebuildable, and automatically governed.</text>

  <g transform="translate(35 150)">
    <rect class="source" width="175" height="170" rx="9"/>
    <text class="label" x="17" y="36">Native transcript</text>
    <text class="body" x="17" y="68">Seven host adapters</text>
    <text class="body" x="17" y="92">capture native bytes</text>
    <text class="body" x="17" y="116">source / project</text>
    <text class="body" x="17" y="140">revision identity</text>
  </g>

  <path class="arrow" d="M210 235 H245"/>

  <g transform="translate(250 150)">
    <rect class="ledger" width="180" height="170" rx="9"/>
    <text class="label" x="16" y="36">Immutable raw ledger</text>
    <text class="code" x="16" y="68">bytes + SHA-256</text>
    <text class="body" x="16" y="94">content-addressed</text>
    <text class="body" x="16" y="118">append-only revisions</text>
    <text class="body" x="16" y="142">canonical evidence</text>
  </g>

  <path class="arrow" d="M430 235 H465"/>

  <g transform="translate(470 150)">
    <rect class="ledger" width="190" height="170" rx="9"/>
    <text class="label" x="16" y="36">Append projection</text>
    <text class="code" x="16" y="67">prefix hash verified</text>
    <text class="body" x="16" y="94">reuse prior projection</text>
    <text class="body" x="16" y="118">process appended tail</text>
    <text class="body" x="16" y="142">rebuildable derivative</text>
  </g>

  <path class="arrow" d="M660 235 H695"/>

  <g transform="translate(700 150)">
    <rect class="card" width="190" height="170" rx="9"/>
    <text class="label" x="16" y="36">Semantic windows</text>
    <text class="body" x="16" y="67">turn + tool-result safe</text>
    <text class="body" x="16" y="94">no orphan tool results</text>
    <text class="body" x="16" y="118">oversized exchange:</text>
    <text class="code" x="16" y="142">continuation metadata</text>
  </g>

  <path class="arrow" d="M890 235 H925"/>

  <g transform="translate(930 150)">
    <rect class="review" width="190" height="170" rx="9"/>
    <text class="label" x="16" y="36">Challenge / candidates</text>
    <text class="body" x="16" y="67">candidate evidence</text>
    <text class="body" x="16" y="92">or zero-candidate</text>
    <text class="body" x="16" y="117">Grill challenge checks</text>
    <text class="body" x="16" y="142">why nothing persists</text>
  </g>

  <path class="arrow" d="M1120 235 H1155"/>

  <g transform="translate(1160 150)">
    <rect class="truth" width="205" height="170" rx="9"/>
    <text class="label" x="16" y="36">Governed assimilation</text>
    <text class="body" x="16" y="66">active host: verify + assimilate</text>
    <text class="body" x="16" y="91">Hook: Dream verifies + compares</text>
    <text class="code" x="16" y="118">applied / rejected</text>
    <text class="code" x="16" y="142">archived / failed</text>
  </g>

  <path class="fallback" d="M565 150 V122 H340 V145"/>
  <text class="body" x="382" y="114" fill="#b45309">prefix mismatch: safe full rebuild</text>

  <path class="branch" d="M565 320 V382 H625"/>
  <g transform="translate(630 350)">
    <rect class="receipt" width="350" height="130" rx="9"/>
    <text class="label" x="18" y="36">Context Projection Receipt</text>
    <text class="body" x="18" y="65">content-free audit: revision + covered range</text>
    <text class="body" x="18" y="89">projection lineage + hashes + token basis</text>
    <text class="body" x="18" y="113">records truncation / eviction / compaction</text>
  </g>

  <path class="branch" d="M1260 320 V405 H1110"/>
  <g transform="translate(1030 350)">
    <rect class="review" width="300" height="130" rx="9"/>
    <text class="label" x="18" y="36">/hm:review — post-hoc only</text>
    <text class="body" x="18" y="66">audit what Dream decided</text>
    <text class="body" x="18" y="90">correct / reject / supersede / undo</text>
    <text class="body" x="18" y="114">never a mandatory promotion gate</text>
  </g>

  <path class="branch" d="M805 480 V535 H610"/>
  <g transform="translate(260 510)">
    <rect class="card" width="345" height="105" rx="9"/>
    <text class="label" x="18" y="35">Derived retrieval surfaces</text>
    <text class="body" x="18" y="64">Observation / FTS / vector / trigram</text>
    <text class="body" x="18" y="87">rebuildable; never canonical truth</text>
  </g>
  <g transform="translate(635 510)">
    <rect class="truth" width="345" height="105" rx="9"/>
    <text class="label" x="18" y="35">Governed long-term truth</text>
    <text class="body" x="18" y="64">confirmed Memory / Rule / Handoff</text>
    <text class="body" x="18" y="87">only the promoted outcome persists</text>
  </g>

  <text class="note" x="52" y="665">Completion is automatic and idempotent: the same immutable revision finalizes once as promoted or no_candidate.</text>
  <text class="note" x="52" y="693">Requirement: every expected chunk is checkpointed with zero character loss; projection caches never replace truth.</text>
</svg>
