<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem lossless session distillation</title>
  <desc id="desc">Native host transcripts are stored as immutable byte revisions, processed through every ordered chunk, reviewed at session end, and only then promoted into governed memory.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .source { fill: #eff6ff; stroke: #7db7dc; stroke-width: 2; }
      .ledger { fill: #ecfdf5; stroke: #66bf9b; stroke-width: 2; }
      .review { fill: #fff7ed; stroke: #e9a85e; stroke-width: 2; }
      .truth { fill: #f0fdf4; stroke: #5fbd82; stroke-width: 2; }
      .label { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .code { font: 600 13px "Cascadia Mono", Consolas, monospace; fill: #0f6fbf; }
      .note { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #0f8c87; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#grayArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f8c87"/>
    </marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="650"/>
  <text class="title" x="64" y="64">Lossless session distillation</text>
  <text class="subtitle" x="64" y="96">Storage is complete, processing is bounded, and promotion waits for full-session review.</text>

  <g transform="translate(55 160)">
    <rect class="source" width="170" height="150" rx="8"/>
    <text class="label" x="20" y="38">Native transcript</text>
    <text class="body" x="20" y="70">Cursor / Claude</text>
    <text class="body" x="20" y="92">Codex / Grok</text>
    <text class="body" x="20" y="114">Hermes / OpenCode</text>
    <text class="body" x="20" y="136">Antigravity</text>
  </g>

  <path class="arrow" d="M225 235 H270"/>

  <g transform="translate(275 160)">
    <rect class="ledger" width="190" height="150" rx="8"/>
    <text class="label" x="18" y="38">Immutable revision</text>
    <text class="code" x="18" y="70">raw bytes + SHA-256</text>
    <text class="body" x="18" y="98">source URI / project</text>
    <text class="body" x="18" y="122">parser version / audit</text>
  </g>

  <path class="arrow" d="M465 235 H510"/>

  <g transform="translate(515 160)">
    <rect class="ledger" width="180" height="150" rx="8"/>
    <text class="label" x="18" y="38">Ordered chunks</text>
    <text class="code" x="18" y="70">0 ... N, no gaps</text>
    <text class="body" x="18" y="98">boundary-aware</text>
    <text class="body" x="18" y="122">zero character loss</text>
  </g>

  <path class="arrow" d="M695 235 H740"/>

  <g transform="translate(745 160)">
    <rect class="card" width="180" height="150" rx="8"/>
    <text class="label" x="18" y="38">Agent checkpoints</text>
    <text class="code" x="18" y="70">claim / submit</text>
    <text class="body" x="18" y="98">lease + retry</text>
    <text class="body" x="18" y="122">resume after crash</text>
  </g>

  <path class="arrow" d="M925 235 H970"/>

  <g transform="translate(975 160)">
    <rect class="review" width="180" height="150" rx="8"/>
    <text class="label" x="18" y="38">Final review</text>
    <text class="body" x="18" y="70">outcome / last turn</text>
    <text class="body" x="18" y="94">conflicts / unfinished</text>
    <text class="body" x="18" y="118">evidence / promotion</text>
  </g>

  <path class="arrow" d="M1155 235 H1200"/>

  <g transform="translate(1205 160)">
    <rect class="truth" width="150" height="150" rx="8"/>
    <text class="label" x="18" y="38">Governed memory</text>
    <text class="body" x="18" y="70">idempotent candidates</text>
    <text class="body" x="18" y="94">auto-review</text>
    <text class="body" x="18" y="118">Dream</text>
  </g>

  <path class="branch" d="M370 310 V390 H590"/>
  <g transform="translate(595 355)">
    <rect class="card" width="260" height="110" rx="8"/>
    <text class="label" x="18" y="36">Derived search rendering</text>
    <text class="body" x="18" y="66">Observation / FTS / vector index</text>
    <text class="body" x="18" y="90">rebuildable; never raw truth</text>
  </g>
  <path class="branch" d="M855 410 H1045"/>
  <g transform="translate(1050 355)">
    <rect class="card" width="250" height="110" rx="8"/>
    <text class="label" x="18" y="36">Read surfaces</text>
    <text class="code" x="18" y="66">wake / search_memory</text>
    <text class="body" x="18" y="90">confirmed truth stays separate</text>
  </g>

  <text class="note" x="64" y="540">A Hook may capture and queue evidence, but it cannot claim that semantic summarization finished.</text>
  <text class="note" x="64" y="570">A job completes only when every expected chunk is checkpointed, the source revision is still current, and final review passes.</text>
</svg>
