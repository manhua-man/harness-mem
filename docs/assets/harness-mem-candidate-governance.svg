<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">harness-mem evidence, job material, and current knowledge boundaries</title>
  <desc id="desc">Immutable sources remain evidence. Candidate claims, verification records, and proposed decisions are temporary job-scoped material. Trusted runtime verification and assimilation may write a clean reusable fact to SQLite knowledge_entries or close without a write. Dream never guesses a winner for unsafe multi-item comparisons.</desc>
  <defs>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.teal{fill:#0f766e}.gold{fill:#c99532}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.source{fill:#eff6ff;stroke:#73aedd;stroke-width:2}
      .soft{fill:#ecfdf5;stroke:#5fbf9a;stroke-width:2}.warm{fill:#fff7ed;stroke:#d99a45;stroke-width:2}
      .violet{fill:#f5f3ff;stroke:#9f8bd7;stroke-width:2}.dark{fill:#0f172a}
      .title{font-size:38px;font-weight:760}.subtitle{font-size:20px}.eyebrow{font-size:16px;font-weight:750;letter-spacing:1px}
      .heading{font-size:24px;font-weight:750}.body{font-size:18px}.small{font-size:16px}.code{font:650 17px "Cascadia Mono",Consolas,monospace}
      .line{fill:none;stroke:#0f766e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#grayArrow)}
      .stop{fill:none;stroke:#c99532;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#goldArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0f766e"/></marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#64748b"/></marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#c99532"/></marker>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <rect class="teal" width="1440" height="10"/>
  <text x="64" y="66" class="title ink">Evidence is not current knowledge</text>
  <text x="64" y="100" class="subtitle muted">The 0.9.26 source keeps immutable sources, temporary job material, and SQLite truth physically distinct.</text>
  <g transform="translate(1204 38)"><rect class="soft" width="172" height="42" rx="21"/><text x="20" y="28" class="eyebrow teal">source 0.9.26</text></g>

  <text x="64" y="150" class="eyebrow muted">ENTRY AND SOURCE</text>
  <g transform="translate(64 176)">
    <rect class="card" width="280" height="146" rx="16"/>
    <text x="24" y="40" class="heading ink">Explicit distill</text>
    <text x="24" y="77" class="body muted">Active host reads the session</text>
    <text x="24" y="105" class="body muted">Runs stages 1–3 directly</text>
    <text x="24" y="131" class="small muted">No background redirect</text>
  </g>
  <g transform="translate(64 350)">
    <rect class="warm" width="280" height="174" rx="16"/>
    <text x="24" y="40" class="heading ink">Stop Hook</text>
    <text x="24" y="77" class="body muted">Save revision + advance job</text>
    <text x="24" y="105" class="body muted">Emit Dream activity signal</text>
    <text x="24" y="138" class="small muted">No model call</text>
    <text x="24" y="162" class="small muted">No knowledge mutation</text>
  </g>

  <g transform="translate(398 176)">
    <rect class="source" width="286" height="348" rx="18"/>
    <text x="24" y="42" class="eyebrow teal">SOURCE AUTHORITY</text>
    <text x="24" y="82" class="heading ink">Transcript ledger</text>
    <text x="24" y="118" class="body muted">Immutable session revision</text>
    <text x="24" y="148" class="body muted">Lossless chunks + manifest</text>
    <text x="24" y="178" class="body muted">Semantic / raw drilldown</text>
    <line x1="24" y1="206" x2="262" y2="206" stroke="#93c5d8" stroke-width="2"/>
    <text x="24" y="242" class="heading ink">Real source refs</text>
    <text x="24" y="278" class="body muted">File / user / transcript digest</text>
    <text x="24" y="308" class="body muted">Reopenable for verification</text>
    <text x="24" y="334" class="small muted">Never cleaned as job material</text>
  </g>
  <path class="branch" d="M344 249h40"/>
  <path class="stop" d="M344 437h22v-88h18"/>

  <g transform="translate(738 176)">
    <rect class="violet" width="300" height="348" rx="18"/>
    <text x="24" y="42" class="eyebrow" fill="#6d5aa8">JOB-SCOPED MATERIAL</text>
    <text x="24" y="82" class="heading ink">0–12 promotion points</text>
    <text x="24" y="118" class="body muted">Candidate claim + location</text>
    <text x="24" y="148" class="body muted">Verification evidence</text>
    <text x="24" y="178" class="body muted">Proposed assimilation decision</text>
    <line x1="24" y1="206" x2="276" y2="206" stroke="#c4b5e6" stroke-width="2"/>
    <text x="24" y="242" class="heading ink">Answer Gate</text>
    <text x="24" y="278" class="body muted">Integrity + current support</text>
    <text x="24" y="308" class="body muted">Each point fails independently</text>
    <text x="24" y="334" class="small muted">Trusted runtime writes; then cleans</text>
  </g>
  <path class="line" d="M684 350h40"/>

  <g transform="translate(1092 176)">
    <rect class="soft" width="284" height="214" rx="18"/>
    <text x="24" y="42" class="eyebrow teal">CURRENT AUTHORITY</text>
    <text x="24" y="82" class="heading ink">SQLite knowledge</text>
    <text x="24" y="116" class="code teal">knowledge_entries</text>
    <text x="24" y="150" class="body muted">One reusable current fact</text>
    <text x="24" y="180" class="body muted">Minimal source + undo linked</text>
    <text x="24" y="204" class="small muted">Markdown is on-demand only</text>
  </g>
  <g transform="translate(1092 420)">
    <rect class="warm" width="284" height="104" rx="16"/>
    <text x="24" y="40" class="heading ink">Explicit non-write</text>
    <text x="24" y="75" class="body muted">reject / defer / conflict / fail</text>
  </g>
  <path class="line" d="M1038 278h40"/>
  <path class="stop" d="M1038 424h40v48h14"/>

  <g transform="translate(64 580)">
    <rect class="dark" width="1312" height="214" rx="20"/>
    <text x="28" y="42" class="eyebrow" fill="#99f6e4">DREAM GUARDRAILS</text>
    <text x="28" y="82" class="heading" fill="#fff">Two queues, one selected CLI agent</text>
    <text x="28" y="116" class="body" fill="#cbd5e1">Session queue processes one immutable session. Project governance queue checks current knowledge and real sources.</text>
    <text x="28" y="144" class="body" fill="#cbd5e1">It also checks duplicates, conflicts, staleness, and retrieval feedback across the project.</text>
    <text x="28" y="172" class="body" fill="#fde68a">enabled=true + selected CLI (current host by default) + strict schema.</text>
    <text x="28" y="198" class="small" fill="#fecaca">Unsafe multi-item comparisons, truncated sources, and unsupported sources close without mutation.</text>
  </g>
  <path class="branch" d="M1376 283h24v277H888v-22"/>
  <text x="1046" y="556" class="small muted">Review reopens verification + assimilation</text>
</svg>
