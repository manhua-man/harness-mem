<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Harness-Mem 当前知识治理</title>
  <desc id="desc">人工 distill 与 Hook 触发的 Dream 是两条执行入口。候选、证据和拟议决定只存在于 job 范围；受信 runtime 经过验证和归纳吸收后才写入 SQLite knowledge_entries。Dream 的自动项最终为 applied、rejected、archived 或 failed；Review 是独立事后纠错支路。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f6fbf"/><stop offset="1" stop-color="#27a878"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#1976b9"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#218563"/></marker>
    <style>
      .bg{fill:#f8fbff}.title{font:700 40px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#102a43}.sub{font:400 18px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#4d657d}.label{font:700 22px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#102a43}.body{font:400 15px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#425c72}.small{font:400 13px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#5f778d}.code{font:700 13px Consolas,monospace;fill:#116eaf}.panel{fill:#fff;stroke:#bed8ed;stroke-width:2}.blue{fill:#ecf7ff;stroke:#90c9e5;stroke-width:2}.green{fill:#eefbf5;stroke:#88cfad;stroke-width:2}.orange{fill:#fff7ed;stroke:#efbb82;stroke-width:2}.purple{fill:#f7f2ff;stroke:#baa7e0;stroke-width:2}.chip{fill:url(#header)}.chipText{font:700 13px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#fff}.line{fill:none;stroke:#1976b9;stroke-width:3;marker-end:url(#arrow)}.good{fill:none;stroke:#218563;stroke-width:3;marker-end:url(#greenArrow)}.dash{fill:none;stroke:#788fa3;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="960"/>
  <rect x="0" y="0" width="1440" height="14" fill="url(#header)"/>
  <text class="title" x="70" y="70">Harness-Mem：当前知识治理</text>
  <text class="sub" x="72" y="105">两条入口，同一验证与归纳合同；候选不是当前知识，Hook 不是语义执行器。</text>

  <g transform="translate(70 165)"><rect class="panel" width="270" height="146" rx="18"/><rect class="chip" x="22" y="20" width="138" height="30" rx="15"/><text class="chipText" x="39" y="41">Explicit distill</text><text class="label" x="22" y="84">人工明确处理</text><text class="body" x="22" y="112">当前宿主读取会话</text><text class="body" x="22" y="135">不改道到 provider</text></g>
  <g transform="translate(70 375)"><rect class="blue" width="270" height="164" rx="18"/><rect class="chip" x="22" y="20" width="112" height="30" rx="15"/><text class="chipText" x="41" y="41">Stop Hook</text><text class="label" x="22" y="84">保存，不判断</text><text class="body" x="22" y="112">immutable revision + job</text><text class="body" x="22" y="136">发出 Dream 活动信号</text><text class="small" x="22" y="155">不读知识 / 不调模型 / 不写 truth</text></g>
  <g transform="translate(405 255)"><rect class="blue" width="312" height="174" rx="18"/><rect class="chip" x="22" y="20" width="164" height="30" rx="15"/><text class="chipText" x="40" y="41">Job-scoped material</text><text class="label" x="22" y="84">会话、候选与证据</text><text class="body" x="22" y="112">完整来源 / semantic windows</text><text class="body" x="22" y="136">candidate + evidence + decision</text><text class="small" x="22" y="157">成功终态后按策略清理</text></g>
  <g transform="translate(405 500)"><rect class="purple" width="312" height="160" rx="18"/><rect class="chip" x="22" y="20" width="182" height="30" rx="15"/><text class="chipText" x="40" y="41">Authorized Dream only</text><text class="label" x="22" y="84">受限后台语义执行器</text><text class="body" x="22" y="112">用户 profile + 环境变量密钥</text><text class="body" x="22" y="136">项目选择 + autonomous 授权</text><text class="small" x="22" y="154">无工具、严格 schema、可替换协议</text></g>
  <g transform="translate(782 165)"><rect class="panel" width="270" height="146" rx="18"/><rect class="chip" x="22" y="20" width="154" height="30" rx="15"/><text class="chipText" x="40" y="41">Extract or compare</text><text class="label" x="22" y="84">提取或项目级比较</text><text class="body" x="22" y="112">触发会话 + 当前知识</text><text class="body" x="22" y="135">来源、重复、冲突、反馈</text></g>
  <g transform="translate(782 375)"><rect class="blue" width="270" height="146" rx="18"/><rect class="chip" x="22" y="20" width="114" height="30" rx="15"/><text class="chipText" x="40" y="41">Verify</text><text class="label" x="22" y="84">Answer Gate</text><text class="body" x="22" y="112">重开真实来源、校验时效</text><text class="body" x="22" y="135">不完整或不支持则 fail closed</text></g>
  <g transform="translate(782 585)"><rect class="green" width="270" height="146" rx="18"/><rect class="chip" x="22" y="20" width="150" height="30" rx="15"/><text class="chipText" x="40" y="41">Assimilate</text><text class="label" x="22" y="84">受信 runtime 写入</text><text class="code" x="22" y="112">add / refine / confirm</text><text class="code" x="22" y="135">supersede / no_write</text></g>
  <g transform="translate(1115 165)"><rect class="green" width="255" height="184" rx="18"/><rect class="chip" x="22" y="20" width="164" height="30" rx="15"/><text class="chipText" x="40" y="41">Current knowledge</text><text class="label" x="22" y="84">SQLite authority</text><text class="code" x="22" y="112">knowledge_entries</text><text class="body" x="22" y="140">稳定、可复用的当前事实</text><text class="small" x="22" y="162">Markdown 只是按需投影</text></g>
  <g transform="translate(1115 435)"><rect class="orange" width="255" height="184" rx="18"/><rect class="chip" x="22" y="20" width="150" height="30" rx="15"/><text class="chipText" x="40" y="41">Terminal outcome</text><text class="label" x="22" y="84">明确非写入终态</text><text class="code" x="22" y="112">rejected / archived</text><text class="code" x="22" y="136">failed (retryable)</text><text class="small" x="22" y="160">Dream 不留下 pending_review</text></g>
  <g transform="translate(1115 700)"><rect class="purple" width="255" height="120" rx="18"/><rect class="chip" x="22" y="18" width="112" height="30" rx="15"/><text class="chipText" x="40" y="39">Review</text><text class="label" x="22" y="78">事后审计与纠错</text><text class="body" x="22" y="103">inspect / correct / undo</text></g>
  <path class="line" d="M340 238 H403"/><path class="line" d="M340 457 H403 V342"/><path class="line" d="M717 342 H780 V238"/><path class="line" d="M717 580 H748 V238 H780"/><path class="line" d="M917 311 V373"/><path class="line" d="M917 521 V583"/><path class="good" d="M1052 658 H1080 V257 H1113"/><path class="line" d="M1052 448 H1113"/><path class="dash" d="M1242 349 V698"/>
  <text class="small" x="74" y="890">会话与真实来源是证据；候选、验证和拟议决定只为 job 重试与审计服务，不进入普通 wake/search。</text>
  <text class="small" x="74" y="916">Dream 只能在来源完整、可重开且项目已授权时自动完成比较 → 验证 → 归纳吸收；多条关系无法安全裁决时，不猜测赢家。</text>
</svg>
