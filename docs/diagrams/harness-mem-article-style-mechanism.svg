<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Harness-Mem 架构与核心机制</title>
  <desc id="desc">文章式 Harness-Mem 架构图，展示显式入口、证据包、AI 提炼、候选层、自动审核、人类复核、confirmed truth、wake/search 消费与本地存储。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e8f2fb" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6fbf"/>
      <stop offset="56%" stop-color="#11a7b5"/>
      <stop offset="100%" stop-color="#45bd92"/>
    </linearGradient>
    <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf5ff"/>
      <stop offset="100%" stop-color="#e9fbf4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1677b9"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f9f7a"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d9791f"/>
    </marker>
    <style>
      .bg { fill: #fbfdff; }
      .grid { fill: url(#grid); opacity: .72; }
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #102a43; letter-spacing: 0; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #4d657d; }
      .panel { fill: #ffffff; stroke: #c6dcee; stroke-width: 1.5; rx: 18; }
      .panelBlue { fill: #eaf5ff; stroke: #9ccfe0; stroke-width: 1.6; rx: 18; }
      .panelGreen { fill: #effbf5; stroke: #92d7b6; stroke-width: 1.6; rx: 18; }
      .panelWarn { fill: #fff7ed; stroke: #f1b979; stroke-width: 1.6; rx: 18; }
      .panelCand { fill: url(#candidate); stroke: #83cbd7; stroke-width: 2; rx: 22; }
      .chip { fill: url(#brand); rx: 16; }
      .chipText { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .mid { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .body { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #425c72; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #60788e; }
      .code { font: 700 13px "Cascadia Mono", Consolas, monospace; fill: #0f6fbf; }
      .arrow { fill: none; stroke: #1677b9; stroke-width: 2.8; marker-end: url(#arrow); }
      .arrowGreen { fill: none; stroke: #1f9f7a; stroke-width: 2.8; marker-end: url(#greenArrow); }
      .arrowOrange { fill: none; stroke: #d9791f; stroke-width: 2.8; marker-end: url(#orangeArrow); }
      .dash { fill: none; stroke: #8ca5bb; stroke-width: 2.1; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1120"/>
  <rect class="grid" width="1440" height="1120"/>
  <rect x="0" y="0" width="1440" height="13" fill="url(#brand)"/>

  <text class="title" x="70" y="72">Harness-Mem：可审计的 Agent Memory Runtime</text>
  <text class="subtitle" x="72" y="106">不是后台自学习，而是显式入口触发：raw evidence -> candidate -> review -> confirmed truth -> wake/search。</text>

  <g transform="translate(72 154)">
    <rect class="panelBlue" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="112" height="32"/>
    <text class="chipText" x="42" y="42">入口层</text>
    <text class="label" x="24" y="82">用户可见入口</text>
    <text class="code" x="24" y="116">/hm:distill / wake / search</text>
    <text class="body" x="24" y="140">Slash / Skill / 自然语言</text>
  </g>

  <g transform="translate(428 154)">
    <rect class="panelBlue" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="118" height="32"/>
    <text class="chipText" x="42" y="42">证据层</text>
    <text class="label" x="24" y="82">Evidence Packet</text>
    <text class="code" x="24" y="116">prepare_session_distill</text>
    <text class="body" x="24" y="140">client=auto, project-scoped</text>
  </g>

  <g transform="translate(784 154)">
    <rect class="panelBlue" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="124" height="32"/>
    <text class="chipText" x="42" y="42">提炼层</text>
    <text class="label" x="24" y="82">LLM Agent</text>
    <text class="body" x="24" y="116">读取 raw session 与 source id</text>
    <text class="body" x="24" y="140">提炼事实、规则、关系、流程</text>
  </g>

  <g transform="translate(1140 154)">
    <rect class="panelWarn" width="228" height="154"/>
    <rect class="chip" x="22" y="20" width="112" height="32"/>
    <text class="chipText" x="42" y="42">边界</text>
    <text class="label" x="24" y="82">不直接写真值</text>
    <text class="body" x="24" y="116">AI 提炼结果先进候选</text>
    <text class="body" x="24" y="140">不是 autonomous learning</text>
  </g>

  <path class="arrow" d="M 358 232 L 426 232"/>
  <path class="arrow" d="M 714 232 L 782 232"/>
  <path class="arrowOrange" d="M 1070 232 L 1138 232"/>

  <g transform="translate(254 382)">
    <rect class="panelCand" width="932" height="256"/>
    <rect class="chip" x="28" y="24" width="152" height="32"/>
    <text class="chipText" x="46" y="46">Candidate Layer</text>
    <text class="label" x="30" y="88">候选层：AI 生成内容的隔离区</text>
    <text class="body" x="30" y="118">所有 AI 提炼、纠错、合并、过期、Skill 学习都先进 pending candidate，不能绕过审核成为长期 truth。</text>

    <g transform="translate(30 154)">
      <rect class="panel" width="190" height="70"/>
      <text class="mid" x="16" y="30">MemoryEntry</text>
      <text class="body" x="16" y="54">事实 / 决策 / 状态</text>
    </g>
    <g transform="translate(246 154)">
      <rect class="panel" width="190" height="70"/>
      <text class="mid" x="16" y="30">RuleCandidate</text>
      <text class="body" x="16" y="54">规则 / 偏好</text>
    </g>
    <g transform="translate(462 154)">
      <rect class="panel" width="190" height="70"/>
      <text class="mid" x="16" y="30">RelationFact</text>
      <text class="body" x="16" y="54">实体关系 / provenance</text>
    </g>
    <g transform="translate(678 154)">
      <rect class="panelWarn" width="210" height="70"/>
      <text class="mid" x="16" y="30">Governance</text>
      <text class="body" x="16" y="54">merge / stale / supersede</text>
    </g>
  </g>

  <path class="arrow" d="M 927 308 C 927 348 850 354 780 380"/>

  <g transform="translate(142 706)">
    <rect class="panelGreen" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="126" height="32"/>
    <text class="chipText" x="42" y="42">审核层</text>
    <text class="label" x="24" y="82">Auto-review</text>
    <text class="code" x="24" y="116">auto_review_candidates</text>
    <text class="body" x="24" y="140">低风险确认，噪声拒绝</text>
  </g>

  <g transform="translate(496 706)">
    <rect class="panelWarn" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="136" height="32"/>
    <text class="chipText" x="42" y="42">人工门</text>
    <text class="label" x="24" y="82">Human Final Review</text>
    <text class="body" x="24" y="116">只看高风险、证据不足</text>
    <text class="body" x="24" y="140">或边界不清的残留项</text>
  </g>

  <g transform="translate(850 706)">
    <rect class="panelGreen" width="286" height="154"/>
    <rect class="chip" x="22" y="20" width="142" height="32"/>
    <text class="chipText" x="42" y="42">真值层</text>
    <text class="label" x="24" y="82">Confirmed Truth</text>
    <text class="body" x="24" y="116">accepted / current memory</text>
    <text class="body" x="24" y="140">才可进入 wake/search</text>
  </g>

  <g transform="translate(1204 706)">
    <rect class="panelGreen" width="164" height="154"/>
    <rect class="chip" x="22" y="20" width="112" height="32"/>
    <text class="chipText" x="42" y="42">消费层</text>
    <text class="label" x="24" y="82">Wake</text>
    <text class="label" x="24" y="112">Search</text>
    <text class="body" x="24" y="140">上下文恢复</text>
  </g>

  <path class="arrowGreen" d="M 370 638 C 320 664 288 682 285 704"/>
  <path class="arrowOrange" d="M 618 638 C 626 668 634 684 639 704"/>
  <path class="arrowGreen" d="M 890 638 C 956 660 990 682 993 704"/>
  <path class="arrowGreen" d="M 1136 783 L 1202 783"/>

  <g transform="translate(72 920)">
    <rect class="panel" width="1296" height="112"/>
    <rect class="chip" x="24" y="22" width="128" height="32"/>
    <text class="chipText" x="42" y="44">本地存储</text>
    <text class="mid" x="178" y="44">JSON blobs + SQLite FTS5 + optional vector cache</text>
    <text class="body" x="178" y="76">LocalVerbatimStore 保留 raw observations；LocalStructuredStore 保存 MemoryEntry / Rule / Skill / Relation；HybridSearchLayer 执行 FTS + vector RRF。</text>
  </g>

  <text class="small" x="74" y="1082">一句话：Harness-Mem 把“AI 觉得重要”变成“可审核候选”，再把通过审核的 confirmed truth 注入 Agent 的长期上下文。</text>
</svg>
