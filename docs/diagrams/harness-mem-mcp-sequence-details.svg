<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Harness-Mem MCP 技术调用链</title>
  <desc id="desc">展示 distill、wake、search 三条主路径在 MCP server、commands、stores 和 signals 间的调用顺序。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e8f2fb" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6fbf"/>
      <stop offset="58%" stop-color="#11a7b5"/>
      <stop offset="100%" stop-color="#45bd92"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1677b9"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f9f7a"/>
    </marker>
    <style>
      .bg { fill: #fbfdff; }
      .grid { fill: url(#grid); opacity: .72; }
      .title { font: 700 40px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #4d657d; }
      .lane { fill: #eef7ff; stroke: #bdd8ea; stroke-width: 1.4; rx: 18; }
      .lane2 { fill: #effcf6; stroke: #9dd8ba; stroke-width: 1.4; rx: 18; }
      .lane3 { fill: #fff7ed; stroke: #f1b979; stroke-width: 1.4; rx: 18; }
      .box { fill: #fff; stroke: #c7ddeb; stroke-width: 1.2; rx: 12; }
      .boxBlue { fill: #eaf5ff; stroke: #9ccfe0; stroke-width: 1.2; rx: 12; }
      .boxGreen { fill: #f0fbf6; stroke: #92d7b6; stroke-width: 1.2; rx: 12; }
      .boxWarn { fill: #fff7ed; stroke: #f1b979; stroke-width: 1.2; rx: 12; }
      .chip { fill: url(#brand); rx: 16; }
      .chipText { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #fff; }
      .label { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .body { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #425c72; }
      .code { font: 700 13px "Cascadia Mono", Consolas, monospace; fill: #0f6fbf; }
      .arrow { fill: none; stroke: #1677b9; stroke-width: 2.7; marker-end: url(#arrow); }
      .arrowGreen { fill: none; stroke: #1f9f7a; stroke-width: 2.7; marker-end: url(#greenArrow); }
      .dash { fill: none; stroke: #8ca5bb; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif; fill: #60788e; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="1080"/>
  <rect class="grid" width="1440" height="1080"/>
  <rect x="0" y="0" width="1440" height="13" fill="url(#brand)"/>

  <text class="title" x="70" y="72">Harness-Mem：MCP 技术调用链</text>
  <text class="subtitle" x="72" y="106">三条主路径：Distill 写候选、Wake 组装上下文、Search 渐进检索；读写副作用和信号记录分开。</text>

  <g transform="translate(70 152)">
    <rect class="lane" width="1300" height="250"/>
    <rect class="chip" x="22" y="20" width="126" height="32"/>
    <text class="chipText" x="42" y="42">Distill path</text>
    <text class="label" x="24" y="86">/hm:distill：显式提炼写候选</text>
    <g transform="translate(24 118)"><rect class="boxBlue" width="178" height="84"/><text class="code" x="14" y="30">prepare_session_distill</text><text class="body" x="14" y="56">client auto + project scope</text></g>
    <g transform="translate(244 118)"><rect class="box" width="168" height="84"/><text class="code" x="14" y="30">ingest_sessions</text><text class="body" x="14" y="56">AdapterRegistry 扫描</text></g>
    <g transform="translate(454 118)"><rect class="box" width="168" height="84"/><text class="code" x="14" y="30">evidence packet</text><text class="body" x="14" y="56">session ids + raw ids</text></g>
    <g transform="translate(664 118)"><rect class="box" width="168" height="84"/><text class="code" x="14" y="30">LLM skill</text><text class="body" x="14" y="56">提炼 facts/rules</text></g>
    <g transform="translate(874 118)"><rect class="boxGreen" width="190" height="84"/><text class="code" x="14" y="30">suggest_*</text><text class="body" x="14" y="56">Memory / Rule / Relation</text></g>
    <g transform="translate(1106 118)"><rect class="boxGreen" width="210" height="84"/><text class="code" x="14" y="30">auto_review(apply=true)</text><text class="body" x="14" y="56">confirm / reject / defer</text></g>
    <path class="arrow" d="M 202 160 L 242 160"/><path class="arrow" d="M 412 160 L 452 160"/><path class="arrow" d="M 622 160 L 662 160"/><path class="arrow" d="M 832 160 L 872 160"/><path class="arrowGreen" d="M 1064 160 L 1104 160"/>
  </g>

  <g transform="translate(70 438)">
    <rect class="lane2" width="1300" height="250"/>
    <rect class="chip" x="22" y="20" width="110" height="32"/>
    <text class="chipText" x="42" y="42">Wake path</text>
    <text class="label" x="24" y="86">/hm:wake：只读 confirmed/current truth，生成上下文</text>
    <g transform="translate(24 118)"><rect class="boxBlue" width="170" height="84"/><text class="code" x="14" y="30">tool_wake</text><text class="body" x="14" y="56">resolve project</text></g>
    <g transform="translate(230 118)"><rect class="box" width="190" height="84"/><text class="code" x="14" y="30">cmd_wake_up</text><text class="body" x="14" y="56">auto ingest 可跳过</text></g>
    <g transform="translate(456 118)"><rect class="box" width="196" height="84"/><text class="code" x="14" y="30">assemble_context_plan</text><text class="body" x="14" y="56">L0-L4 budget plan</text></g>
    <g transform="translate(688 118)"><rect class="box" width="178" height="84"/><text class="code" x="14" y="30">wake_render.py</text><text class="body" x="14" y="56">source ids + layers</text></g>
    <g transform="translate(902 118)"><rect class="boxGreen" width="178" height="84"/><text class="code" x="14" y="30">record signals</text><text class="body" x="14" y="56">wake_surfaced</text></g>
    <g transform="translate(1116 118)"><rect class="boxGreen" width="178" height="84"/><text class="code" x="14" y="30">wake text</text><text class="body" x="14" y="56">compact 可 opt-in</text></g>
    <path class="arrow" d="M 194 160 L 228 160"/><path class="arrow" d="M 420 160 L 454 160"/><path class="arrow" d="M 652 160 L 686 160"/><path class="arrowGreen" d="M 866 160 L 900 160"/><path class="arrowGreen" d="M 1080 160 L 1114 160"/>
  </g>

  <g transform="translate(70 724)">
    <rect class="lane" width="1300" height="250"/>
    <rect class="chip" x="22" y="20" width="118" height="32"/>
    <text class="chipText" x="42" y="42">Search path</text>
    <text class="label" x="24" y="86">/hm:search：渐进检索，先摘要与 source ids，需要再 drilldown</text>
    <g transform="translate(24 118)"><rect class="boxBlue" width="170" height="84"/><text class="code" x="14" y="30">search_memory</text><text class="body" x="14" y="56">structured + raw</text></g>
    <g transform="translate(230 118)"><rect class="box" width="184" height="84"/><text class="code" x="14" y="30">HybridSearchLayer</text><text class="body" x="14" y="56">mode=auto/fts/hybrid</text></g>
    <g transform="translate(450 118)"><rect class="box" width="184" height="84"/><text class="code" x="14" y="30">SQLite FTS5</text><text class="body" x="14" y="56">bm25 + fallback</text></g>
    <g transform="translate(670 118)"><rect class="box" width="184" height="84"/><text class="code" x="14" y="30">vec_embeddings</text><text class="body" x="14" y="56">optional semantic</text></g>
    <g transform="translate(890 118)"><rect class="boxGreen" width="184" height="84"/><text class="code" x="14" y="30">RRF fusion</text><text class="body" x="14" y="56">FTS + vector rank</text></g>
    <g transform="translate(1110 118)"><rect class="boxGreen" width="184" height="84"/><text class="code" x="14" y="30">search_hit signal</text><text class="body" x="14" y="56">可影响 opt-in 排序</text></g>
    <path class="arrow" d="M 194 160 L 228 160"/><path class="arrow" d="M 414 160 L 448 160"/><path class="arrow" d="M 634 160 L 668 160"/><path class="arrowGreen" d="M 854 160 L 888 160"/><path class="arrowGreen" d="M 1074 160 L 1108 160"/>
  </g>

  <g transform="translate(70 1002)">
    <rect class="lane3" width="1300" height="54"/>
    <text class="small" x="24" y="34">关键技术边界：`auto_review_candidates` 默认可 dry-run，只有显式 `apply=true` 才写；wake/search 记录 usage signal 但不自动改 truth；pending 候选不进入默认 wake。</text>
  </g>
</svg>
