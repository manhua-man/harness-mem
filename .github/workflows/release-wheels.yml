# Build, smoke-test, and attach native artifacts to GitHub Releases on version tags.
name: release-wheels

on:
  push:
    tags:
      - "v*"

jobs:
  build-native-wheel:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --features python-extension --out dist
          sccache: "true"
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  fresh-install-smoke:
    needs: [build-native-wheel]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install matching wheel from release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, subprocess, sys;
          version=os.environ['RELEASE_TAG'].removeprefix('v');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--find-links', 'dist', 'harness-mem==' + version])"
      - name: Verify first MCP run and automatic hook bootstrap
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python code/scripts/smoke_fresh_install.py
          --expected-version ${{ github.ref_name }}
      - name: Verify seven-host transcript-to-wake replay
        run: python code/scripts/smoke_host_replay.py --require-installed-wheel

  windows-upgrade-lifecycle-smoke:
    needs: [build-native-wheel]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      UPGRADE_BASE_TAG: v0.9.6
      UPGRADE_STATE_DIR: upgrade state/项目
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download the supported upgrade baseline wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ env.UPGRADE_BASE_TAG }}"
          --repo "${{ github.repository }}"
          --pattern "*win_amd64.whl"
          --dir upgrade-dist
      - name: Install baseline wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheels=list(pathlib.Path('upgrade-dist').glob('*win_amd64.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: Prepare baseline canonical and legacy state
        run: >-
          python code/scripts/smoke_install_lifecycle.py prepare-upgrade
          --expected-version "${{ env.UPGRADE_BASE_TAG }}"
          --state-dir "${{ env.UPGRADE_STATE_DIR }}"
          --require-installed-wheel
      - name: Install release wheel over baseline
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, subprocess, sys;
          version=os.environ['RELEASE_TAG'].removeprefix('v');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', '--find-links', 'dist', 'harness-mem==' + version])"
      - name: Verify migration rollback, legacy restore, and cleanup retry
        run: >-
          python code/scripts/smoke_install_lifecycle.py verify-upgrade
          --expected-version "${{ github.ref_name }}"
          --state-dir "${{ env.UPGRADE_STATE_DIR }}"
          --require-installed-wheel

  hybrid-index-release-smoke:
    needs: [build-native-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install release wheel with real vector dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, subprocess, sys;
          version=os.environ['RELEASE_TAG'].removeprefix('v');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest', 'numpy', 'sqlite-vec']);
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--find-links', 'dist', 'harness-mem==' + version])"
      - name: Verify packaged embedding and sqlite-vec generation contracts
        run: >-
          python -m pytest -q
          code/tests/test_embedding_batch_rebuild.py
          code/tests/test_sqlite_vec_index.py
          code/tests/test_vec0_generation_failures.py
          code/tests/test_doctor_vec0.py

  full-python-release-gate:
    needs: [build-native-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the release wheel and test dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, subprocess, sys;
          version=os.environ['RELEASE_TAG'].removeprefix('v');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest', 'pytest-asyncio', 'PyYAML', 'numpy', 'sqlite-vec', 'tiktoken']);
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--find-links', 'dist', 'harness-mem==' + version])"
      - name: Version-alignment preflight
        run: >-
          python -m pytest -q
          code/tests/test_package_version_alignment.py
          code/tests/test_version_drift.py
      - name: Run the complete Python contract suite
        run: python -m pytest

  publish-github-release:
    needs:
      - build-native-wheel
      - build-sdist
      - fresh-install-smoke
      - windows-upgrade-lifecycle-smoke
      - hybrid-index-release-smoke
      - full-python-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* --clobber
